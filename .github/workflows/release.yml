name: Publish aux Release

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'release v1.0.0' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Release v1.0.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: "aux ClassicAPI v1.0.0"
          generate_release_notes: false
          make_latest: true
          body: |
            # 🏛️ aux ClassicAPI v1.0.0

            This first release focuses on **performance, smoother Auction House usage and safer background processing** while preserving the original aux workflow and pricing behaviour.

            ## ⚡ Performance & Responsiveness

            - Reduced unnecessary per-frame work across **Search, Auctions, Bids and Post**.
            - Added bounded WDB cache scanning to avoid large synchronous item-cache bursts.
            - Replaced permanent merchant polling with one-shot inventory updates.
            - Reduced repeated SavedVariables parsing for daily Auction House prices.
            - Reduced temporary allocations in historical-value and tooltip calculations.
            - Auction listings now stop processing once all visible rows are filled.
            - Selection lookups return immediately once the selected auction is found.
            - Disenchant calculations are skipped when their tooltip options are disabled.

            ## 📊 Price History & LFT Sharing

            - Improved the hot path used to process scanned Auction House prices.
            - Improved `AuxData` handling from the **LFT** channel with earlier filtering and cached daily minimums.
            - **Today** remains the lowest unit buyout known for the current day.
            - **Value** remains the long-term historical reference calculated from up to 11 daily values.
            - Searches of **15 pages or more** are not broadcast through LFT to reduce unnecessary channel traffic.
            - Existing SavedVariables and historical data remain compatible.

            ## 🏛️ Auction House & Compatibility

            - Existing Bid, Buyout, Cancel, undercut and posting behaviour is preserved.
            - Existing pricing formulas and thresholds are unchanged.
            - aux continues to use the native `CanSendAuctionQuery()` flow before requesting the next page.
            - Optional tools such as **AuctionQueryThrottle** can reduce the vanilla client-side 5-second query delay on compatible servers.
            - Server-side Auction House rate limits still apply and cannot be bypassed by aux.
            - Embedded **ChatThrottleLib** remains unchanged for safe LFT message handling.

            ## 🎨 Tooltips & Documentation

            - Reduced repeated tooltip scans and temporary table creation.
            - Preserved tooltip colors, requirements, durability and item information.
            - README completely reorganized in the compact **ShaguTweaks-style** format.
            - Added clearer documentation for **Value vs Today**, LFT sharing, commands and shortcuts.
            - Corrected posting durations to **6 / 24 / 72 hours**.

            ## ✅ Validation

            Changes were tested incrementally in-game on **WoW 1.12.1 / Turtle WoW**, including:

            **Search, Real Time mode, Bid, Buyout, Cancel, Post, merchants, tooltips, price history and LFT sharing.**

            No reset of existing aux SavedVariables is required.
